<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SROVA</title>

<!-- Srova Favicon -->
<link rel="icon" href="/ui_web/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/ui_web/icon-32.png">
<link rel="apple-touch-icon" href="/ui_web/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="/ui_web/icon-512.png">
<link rel="manifest" href="/ui_web/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#050505">

<link rel="stylesheet" href="/ui_web/srova.css?v=20260727_v1_scrobbling_signup3">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header>

  <button id="headerHomeBtn" onclick="goHome()" title="Home" aria-label="SROVA Home">
    <img src="/ui_web/assets/srova-wordmark.svg?v=20260512a" alt="SROVA" class="srovaHeaderWordmark" draggable="false">
  </button>

  <div id="srovaInstanceLabel" class="hidden" aria-live="polite"></div>

  <div id="searchBox">
    <input
      id="searchInput"
      name="srova_global_search"
      type="text"
      placeholder="Search songs, albums, artists..."
      autocomplete="off"
      autocapitalize="none"
      autocorrect="off"
      spellcheck="false"
      oninput="onSearchInput(event)"
      onkeydown="onSearchKey(event)"
    >
    <button id="searchClear" class="hidden" onclick="clearSearch()">
      <span class="material-icons">close</span>
    </button>
  </div>

  <button id="queueBtn" onclick="showQueue()" title="Play Queue">
    <span class="material-icons">queue_music</span>
  </button>

  <button id="playlistsBtn" onclick="showPlaylists()" title="My Playlists">
    <span class="material-icons">library_music</span>
  </button>

  <button id="settingsBtn" onclick="showSettings()" title="Settings">
    <span class="material-icons">settings</span>
  </button>

</header>


<!-- LOGIN MODAL -->
<div id="loginModal" class="hidden">
  <div id="loginCard">
    <div id="loginWaiting" class="hidden">
      <p class="loginInstruction">Open the link below in your browser and log in to Tidal:</p>
      <a id="loginUrl" href="#" target="_blank" rel="noopener"></a>
      <p class="loginStatus">Waiting for authorisation<span class="loginDots"></span></p>
      <button class="loginCancelBtn" onclick="cancelLogin()">Cancel</button>
    </div>
    <div id="loginError" class="hidden">
      <p class="loginInstruction">Login failed. Please try again.</p>
      <button class="loginCancelBtn" onclick="cancelLogin()">Close</button>
    </div>
  </div>
</div>


<!-- HOME PAGE -->
<div id="homeView">
  <div id="homeSections"></div>
</div>


<!-- MY ALBUMS FULL PAGE -->
<div id="myAlbumsView" style="display:none">
  <div class="libraryViewHeader">
    <div class="libraryViewTitle">My Albums</div>
    <div class="libraryViewActions">
      <div id="myAlbumsViewToggleMount"
           class="libraryViewToggleMount"></div>
      <button type="button"
              class="libraryBackBtn"
              onclick="showView('home')"
              title="Back"
              aria-label="Back">
        <span class="material-icons">arrow_back</span>
      </button>
    </div>
  </div>
  <div id="myAlbumsGrid"></div>
</div>


<!-- MY SONGS FULL PAGE -->
<div id="mySongsView" style="display:none">
  <div class="libraryViewHeader">
    <div class="libraryViewTitle">My Songs</div>
    <div class="libraryViewActions">
      <div id="mySongsViewToggleMount"
           class="libraryViewToggleMount"></div>
      <button type="button"
              class="libraryBackBtn"
              onclick="showView('home')"
              title="Back"
              aria-label="Back">
        <span class="material-icons">arrow_back</span>
      </button>
    </div>
  </div>
  <div id="mySongsGrid"></div>
</div>


<!-- MY PLAYLISTS PAGE -->
<div id="playlistsView" style="display:none">
  <div id="playlistsContent"></div>
</div>


<!-- SEARCH RESULTS -->
<div id="searchView" style="display:none">
  <div id="searchResults"></div>
</div>

<!-- LOCAL MUSIC PAGE -->
<div id="localMusicView" style="display:none">
  <div id="localMusicContent"></div>
</div>


<!-- ALBUM / PLAYLIST / MIX / ARTIST PAGE -->
<div id="albumView" style="display:none">
  <div id="albumHeader">
    <button id="backBtn" onclick="goBack()">
      <span class="material-icons">arrow_back</span>
    </button>
    <img id="albumArt">
    <div>
      <div id="albumTitle"></div>
      <div id="albumArtist"></div>
      <div id="albumTechInfo" class="hidden"></div>
      <div id="albumStatsLine" class="hidden"></div>
    </div>
  </div>
  <div id="trackList"></div>
</div>


<!-- PLAY QUEUE PAGE -->
<div id="queueView" style="display:none"></div>


<!-- SETTINGS PAGE -->
<div id="settingsView" style="display:none"></div>


<!-- NOW PLAYING FULL SCREEN VIEW -->
<div id="nowPlayingView" class="hidden">

  <div id="nowPlayingInner">

    <div id="nowPlayingBrand" aria-label="SROVA">
      <img src="/ui_web/assets/srova-wordmark.svg?v=20260512a" alt="SROVA" class="srovaNowPlayingWordmark" draggable="false">
    </div>

    <div id="nowPlayingHeader">
      <button id="nowPlayingDown" onclick="closeNowPlaying()">
        <span class="material-icons">keyboard_arrow_down</span>
      </button>
      <div id="nowPlayingFrom">
        <div id="nowPlayingFromLabel">PLAYING FROM</div>
        <div id="nowPlayingFromTitle"></div>
      </div>
      <div id="npHeaderRight">
        <button id="npBtnVU" onclick="openVuPanel()" title="VU Meter">
          <span class="material-icons">graphic_eq</span>
        </button>
        <button id="npBtnLyrics" onclick="openLyricsPanel()" title="Lyrics">
          <span class="material-icons">lyrics</span>
        </button>
        <button id="npBtnInfo" onclick="openMetaPanel()" title="Track Info">
          <span class="material-icons">info_outline</span>
        </button>
        <button id="npBtnQueue" onclick="showQueue()" title="View Play Queue">
          <span class="material-icons">queue_music</span>
        </button>
      </div>
    </div>

    <img id="nowPlayingArt" onclick="closeNowPlaying()">

    <div id="nowPlayingMeta">
      <div id="nowPlayingMetaText">
        <div id="nowPlayingTrack"></div>
        <div id="nowPlayingArtist"></div>
        <div id="radioArtistNowPlaying" style="display:none"></div>
        <div id="radioTitleNowPlaying" style="display:none"></div>
        <div id="nowPlayingTechRow">
          <div class="audioInfoStack">
            <div id="nowPlayingDacName" class="audioInfoBox audioInfoOff"></div>
            <div id="nowPlayingQuality"></div>
          </div>
          <span id="npExclusiveLock" class="exclusiveLock exclusiveLockOff" title="Exclusive mode off">
            <span class="material-icons">lock</span>
          </span>
          <span id="npBitPerfect" class="bitPerfectReadout bitPerfectOff" title="Bit Perfect Unconfirmed" aria-label="Bit Perfect Unconfirmed">BP</span>
          <div id="npWaveformBars" class="srovaRoundLogoVisualizer npWaveformBars" aria-hidden="true">
            <div class="srovaRoundLogoCore" aria-hidden="true">
              <span class="srovaRoundLogoBar srovaRoundLogoBar1"></span>
              <span class="srovaRoundLogoBar srovaRoundLogoBar2"></span>
              <span class="srovaRoundLogoBar srovaRoundLogoBar3"></span>
              <span class="srovaRoundLogoBar srovaRoundLogoBar4"></span>
              <span class="srovaRoundLogoBar srovaRoundLogoBar5"></span>
            </div>
          </div>
        </div>
      </div>
      <button id="npBtnHeart" onclick="toggleNpHeart()" title="Favorite">
        <span class="material-icons">favorite_border</span>
      </button>
    </div>

    <div id="nowPlayingProgressWrap">
      <div id="nowPlayingProgress">
        <div id="nowPlayingFill"></div>
      </div>
      <div id="nowPlayingTimes">
        <span id="nowPlayingCurrent">0:00</span>
        <span id="nowPlayingTotal">0:00</span>
      </div>
    </div>

    <div id="nowPlayingControls">
      <button id="npBtnRepeat"  onclick="toggleRepeat()"><span class="material-icons">repeat</span></button>
      <button id="npBtnPrev"    onclick="prevTrack()"><span class="material-icons">skip_previous</span></button>
      <button id="npBtnPlay"    onclick="togglePlayPause()" aria-label="Play" title="Play"><span class="material-icons">play_arrow</span></button>
      <button id="npBtnNext"    onclick="nextTrack()"><span class="material-icons">skip_next</span></button>
      <button id="npBtnShuffle" onclick="toggleShuffle()"><span class="material-icons">shuffle</span></button>
    </div>

  </div><!-- end nowPlayingInner -->

  <!-- TRACK INFO PANEL -- slides up over Now Playing -->
  <div id="metaPanel">
    <div id="metaPanelHandle">
      <button id="metaCloseBtn" onclick="closeMetaPanel()">
        <span class="material-icons">keyboard_arrow_down</span>
      </button>
      <div id="metaPanelTitle">Track Info</div>
      <div style="width:40px"></div>
    </div>
    <div id="metaContent"></div>
  </div>

  <!-- LYRICS PANEL -- slides up over Now Playing -->
  <div id="lyricsPanel">
    <div id="lyricsPanelHandle">
      <button id="lyricsCloseBtn" onclick="closeLyricsPanel()">
        <span class="material-icons">keyboard_arrow_down</span>
      </button>
      <div id="lyricsPanelTitle">Lyrics</div>
      <div style="width:40px"></div>
    </div>
    <div id="lyricsContent"></div>
  </div>

  <!-- VU METER PANEL -- slides up over Now Playing (mobile/tablet only) -->
  <div id="vuPanel">
    <div id="vuPanelHandle">
      <button id="vuCloseBtn" onclick="closeVuPanel()">
        <span class="material-icons">keyboard_arrow_down</span>
      </button>
      <div id="vuPanelTitle">VU Meter</div>
      <div style="width:40px"></div>
    </div>
    <div id="vuMeters">
      <div class="vuMeterWrap"><canvas id="vuCanvasL"></canvas></div>
      <div class="vuMeterWrap"><canvas id="vuCanvasR"></canvas></div>
    </div>
    <div id="vuPanelBar">
      <div id="vpbLeft">
        <img id="vpbArt">
        <div id="vpbMeta">
          <div id="vpbTrack"></div>
          <div id="vpbArtist"></div>
        </div>
      </div>
      <div id="vpbProgress">
        <span id="vpbCurrent">0:00</span>
        <div id="vpbProgressBar"><div id="vpbFill"></div></div>
        <span id="vpbTotal">0:00</span>
      </div>
      <div id="vpbRight">
        <div id="vpbControls">
          <button onclick="prevTrack()"><span class="material-icons">skip_previous</span></button>
          <button id="vpbBtnPlay" onclick="togglePlayPause()" aria-label="Play" title="Play"><span class="material-icons">play_arrow</span></button>
          <button onclick="nextTrack()"><span class="material-icons">skip_next</span></button>
        </div>
        <span id="vpbBadge" class="hidden"></span>
      </div>
    </div>
  </div>

</div><!-- end nowPlayingView -->


<div id="playerBar" class="hidden">

  <div class="playerTop">
    <div class="playerLeft">
      <img id="playerArt" class="playerArtwork" onclick="openNowPlaying()" style="cursor:pointer">
      <div class="playerInfo">
        <div id="playerTrack"></div>
        <div class="playerInfoRow">
          <span id="playerArtist"></span>
        </div>
        <div id="radioArtistPlayerBar" style="display:none"></div>
        <div id="radioTitlePlayerBar" style="display:none"></div>
      </div>
    </div>
    <div class="playerControls">
      <button id="btnRepeat"    onclick="toggleRepeat()"><span class="material-icons">repeat</span></button>
      <button id="btnPrev"      onclick="prevTrack()"><span class="material-icons">skip_previous</span></button>
      <button id="btnPlayPause" onclick="togglePlayPause()" aria-label="Play" title="Play"><span class="material-icons">play_arrow</span></button>
      <button id="btnNext"      onclick="nextTrack()"><span class="material-icons">skip_next</span></button>
      <button id="btnShuffle"   onclick="toggleShuffle()"><span class="material-icons">shuffle</span></button>
    </div>
    <div class="playerRight">
      <button id="playerTechTrayToggle" type="button" aria-expanded="false" aria-controls="playerTechTray" aria-label="Show audio path details">
        <span class="material-icons">keyboard_arrow_up</span>
      </button>
      <div id="playerTechTray" aria-hidden="false">
        <div class="playerTechTrayInner">
          <div class="audioInfoStack">
            <div id="playerDacName" class="audioInfoBox audioInfoOff"></div>
            <div id="playerMeta"></div>
          </div>
          <div class="playerTechTrayControls">
            <span id="exclusiveLock" class="exclusiveLock exclusiveLockOff" title="Exclusive mode off" onclick="toggleExclusiveFromLock()">
              <span class="material-icons">lock</span>
            </span>
            <span id="bitPerfect" class="bitPerfectReadout bitPerfectOff" title="Bit Perfect Unconfirmed" aria-label="Bit Perfect Unconfirmed">BP</span>
          </div>
          <!-- RC3 Point 4: mobile-portrait track metadata row. -->
          <div id="playerTrayTrackInfo" class="playerTrayTrackInfo" aria-hidden="true">
            <div id="playerTrayTrackInfoText" class="playerTrayTrackInfoText"></div>
          </div>
        </div>
      </div>
      <div id="playerInfinitePlayControl" class="playerInfinitePlayControl" aria-hidden="true">
        <button id="playerInfinitePlayBtn" class="playerInfinitePlayBtn" type="button" aria-expanded="false" aria-controls="playerInfinitePlayMenu" aria-label="Infinite Play mode">
                    <svg class="playerInfinitePlaySvg playerInfinitePlaySvgRecraft" viewBox="0 0 1536 1024" aria-hidden="true" focusable="false">
            <defs>
              <radialGradient id="playerInfinitePlayModeGradient" cx="50%" cy="50%" r="72%">
                <stop class="playerInfinitePlayModeGradientCore" offset="0%"></stop>
                <stop class="playerInfinitePlayModeGradientMid" offset="28%"></stop>
                <stop class="playerInfinitePlayModeGradientOuter" offset="100%"></stop>
              </radialGradient>
            </defs>
            <circle class="playerInfinitePlayModeHalo" cx="455" cy="506" r="132"></circle>
            <circle class="playerInfinitePlayModeCore" cx="455" cy="506" r="54"></circle>
            <ellipse class="playerInfinitePlayModeCoreSpec" cx="438" cy="485" rx="18" ry="10" transform="rotate(-20 438 485)"></ellipse>

 357.205 577.701C376.047 576.098 390.971 572.323 408.457 565.631Z"></path>

          </svg>
        </button>
        <div id="playerInfinitePlayMenu" class="playerInfinitePlayMenu" aria-hidden="true">
          <button type="button" class="playerInfinitePlayMenuBtn infinitePlayModeSame" data-mode="same_artist">Same Artist</button>
          <button type="button" class="playerInfinitePlayMenuBtn infinitePlayModeSimilar" data-mode="similar_artist">Similar Artists</button>
          <button type="button" class="playerInfinitePlayMenuBtn infinitePlayModeSurprise" data-mode="surprise_me">Surprise Me</button>
        </div>
      </div>
      <button id="playerTechTrayInlineToggle" type="button" aria-expanded="false" aria-disabled="true" disabled aria-controls="playerTechTray" aria-label="Show audio path details">
        <span class="material-icons">keyboard_arrow_up</span>
      </button>
      <!-- SROVA visualizer swap 030526_1918: round animated logo replaces the old four-bar waveform.
           Cosmetic-only and reversible: restore the old #waveformBars span block to undo. -->
      <div id="waveformBars" class="srovaRoundLogoVisualizer" aria-hidden="true">
        <div class="srovaRoundLogoCore" aria-hidden="true">
          <span class="srovaRoundLogoBar srovaRoundLogoBar1"></span>
          <span class="srovaRoundLogoBar srovaRoundLogoBar2"></span>
          <span class="srovaRoundLogoBar srovaRoundLogoBar3"></span>
          <span class="srovaRoundLogoBar srovaRoundLogoBar4"></span>
          <span class="srovaRoundLogoBar srovaRoundLogoBar5"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="playerProgress">
    <span id="currentTime">0:00</span>
    <div id="progressBar"><div id="progressFill"></div></div>
    <span id="totalTime">0:00</span>
  </div>

</div>


<div id="add-radio-modal" class="modal hidden" aria-hidden="true">
  <div class="modal-content">
    <h2 id="radio-modal-title">Add station</h2>
    <div class="field floating"><label for="radio-name">Name</label><input id="radio-name" type="text" autocomplete="off"></div>
    <div class="field floating"><label for="radio-url">URL</label><input id="radio-url" type="url" autocomplete="off"></div>
    <div class="field floating"><label for="radio-icon">Icon</label><input id="radio-icon" type="text" autocomplete="off"></div>
    <div id="radio-modal-error" class="hidden" style="color:#e05050;font-size:13px;margin-top:8px;"></div>
    <div class="modal-actions">
      <button id="radio-cancel" class="pill" onclick="closeAddRadioModal()">Cancel</button>
      <button id="radio-add" class="pill primary" onclick="submitAddRadio()">Add</button>
    </div>
  </div>
</div>

<script src="/ui_web/ui.js?v=20260727_v1_first_run1"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/ui_web/sw.js").catch(function() {});
  });
}
</script>

</body>
</html>
